<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#112344;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#175cdd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)" />

  <!-- Letter K bold -->
  <text x="10" y="46" font-family="'Arial Black', Arial, sans-serif"
        font-size="38" font-weight="900" fill="white" letter-spacing="-1">K</text>

  <!-- Coin circle top-right -->
  <circle cx="47" cy="20" r="12" fill="url(#coin)" />
  <text x="47" y="25" font-family="Arial" font-size="13" font-weight="700"
        fill="#7c3f00" text-anchor="middle">Rp</text>
</svg>
